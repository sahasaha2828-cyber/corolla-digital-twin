<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corolla Digital Twin — 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b10;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.top{position:fixed;top:14px;left:14px;right:14px;z-index:5;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
.brand,.btn,.panel{background:rgba(10,15,22,.90);border:1px solid #34404d;box-shadow:0 8px 28px rgba(0,0,0,.3);backdrop-filter:blur(10px)}
.brand{padding:13px 17px;border-radius:18px;pointer-events:auto}
.brand b{display:block;font-size:17px}.brand span{color:#9ca9b8;font-size:12px}
.actions{display:flex;gap:8px;pointer-events:auto}.btn{color:#fff;border-radius:15px;padding:13px 15px;font-weight:700;font-size:13px}
.btn:active{transform:scale(.97)}
.panel{position:fixed;left:14px;right:14px;bottom:14px;z-index:5;border-radius:22px;padding:12px;max-height:34vh;overflow:auto}
.tabs{display:flex;gap:8px;overflow:auto;direction:rtl;padding-bottom:9px}.tab{white-space:nowrap;border:1px solid #354252;background:#111923;color:#dce3ea;border-radius:14px;padding:11px 13px;font-weight:700}.tab.active{border-color:#8c9aaa;background:#1b2530}
.info{display:flex;justify-content:space-between;gap:14px;align-items:center}.name{font-size:21px;font-weight:800}.meta{font-size:12px;color:#9eabb8;margin-top:4px}.badge{border:1px solid #34404d;border-radius:999px;padding:8px 11px;color:#c8d0d8;font-size:11px}
.hint{color:#83909d;font-size:12px;margin-top:10px;text-align:center}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#070b10;color:#fff;font-size:15px}
#err{display:none;position:fixed;z-index:30;inset:20px;background:#111820;border:1px solid #7a3d3d;border-radius:18px;padding:22px;color:#fff}
@media(max-width:600px){.brand{padding:11px 13px}.brand b{font-size:15px}.btn{padding:11px 12px}.panel{max-height:37vh}.name{font-size:19px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="loading">جاري تحميل النموذج ثلاثي الأبعاد…</div>
<div id="err"></div>

<div class="top">
  <div class="actions">
    <button class="btn" id="explode">تفكيك</button>
    <button class="btn" id="xray">X-RAY</button>
    <button class="btn" id="reset">إعادة</button>
  </div>
  <div class="brand"><b>TOYOTA COROLLA</b><span>FAW • Hybrid 1.8 • 2024 • 3D Digital Twin</span></div>
</div>

<div class="panel">
  <div class="tabs">
    <button class="tab active" data-sys="all">السيارة كاملة 🚗</button>
    <button class="tab" data-sys="body">الهيكل</button>
    <button class="tab" data-sys="engine">المحرك</button>
    <button class="tab" data-sys="hybrid">الهجين 🔋</button>
    <button class="tab" data-sys="brakes">الفرامل</button>
    <button class="tab" data-sys="wheels">الإطارات</button>
    <button class="tab" data-sys="interior">المقصورة</button>
  </div>
  <div class="info">
    <div><div class="name" id="name">لم يتم تحديد قطعة</div><div class="meta" id="meta">اضغط على أي جزء من السيارة لمعرفة اسمه ونظامه</div></div>
    <div class="badge" id="count">0 أجزاء</div>
  </div>
  <div class="hint">اسحب بإصبعك للدوران • قرّب/أبعد بإصبعين • اضغط على القطعة لتحديدها</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script>
<script>
(()=> {
"use strict";
const loading=document.getElementById('loading'), err=document.getElementById('err');
if(!window.THREE){loading.style.display='none';err.style.display='block';err.innerHTML='<h2>تعذر تحميل محرك 3D</h2><p>تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</p>';return;}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070b10);
scene.fog=new THREE.Fog(0x070b10,22,48);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);
camera.position.set(7.5,4.8,9.5);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xcfe2ff,0x10151b,2.1));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(6,10,7);scene.add(key);
const fill=new THREE.DirectionalLight(0x9fc5ff,1.5);fill.position.set(-8,4,-5);scene.add(fill);

const floor=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.MeshStandardMaterial({color:0x0d1319,roughness:.9}));
floor.rotation.x=-Math.PI/2;floor.position.y=-1.05;scene.add(floor);

const root=new THREE.Group();scene.add(root);
const parts=[];
const systems={body:[],engine:[],hybrid:[],brakes:[],wheels:[],interior:[]};

function mat(c,rough=.55,metal=.05,opacity=1){
 return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal,transparent:opacity<1,opacity});
}
const bodyMat=mat(0xf2f4f6,.3,.18), darkMat=mat(0x111820,.45,.35), glassMat=mat(0x172a38,.18,.35,.68);
const chrome=mat(0xbcc6ce,.22,.8), tireMat=mat(0x07090b,.82,.05), red=mat(0xa9161f,.3,.2), gold=mat(0xd6aa38,.3,.5);
function addMesh(name,sys,geo,material,pos,rot=[0,0,0],scale=[1,1,1]){
 const m=new THREE.Mesh(geo,material);m.name=name;m.position.set(...pos);m.rotation.set(...rot);m.scale.set(...scale);m.userData={name,sys,base:m.position.clone(),baseRot:m.rotation.clone(),baseScale:m.scale.clone(),offset:new THREE.Vector3()};
 root.add(m);parts.push(m);systems[sys].push(m);return m;
}
function box(name,sys,size,pos,material,rot=[0,0,0]){return addMesh(name,sys,new THREE.BoxGeometry(...size),material,pos,rot);}
function cyl(name,sys,r,d,pos,material,rot=[0,0,0],seg=32){return addMesh(name,sys,new THREE.CylinderGeometry(r,r,d,seg),material,pos,rot);}
function torus(name,sys,R,r,pos,material,rot=[Math.PI/2,0,0]){return addMesh(name,sys,new THREE.TorusGeometry(R,r,16,36),material,pos,rot);}

const L=3.9,W=1.75;
box('Body Shell','body',[6.9,1.05,1.75],[0,.05,0],bodyMat);
box('Hood','body',[2.15,.14,1.68],[-2.25,.66,0],bodyMat,[0,0,-.02]);
box('Roof','body',[2.7,.14,1.58],[.35,1.25,0],bodyMat,[0,0,.02]);
box('Trunk Lid','body',[1.45,.14,1.68],[2.45,.66,0],bodyMat,[0,0,.02]);
box('Front Bumper','body',[.18,.72,1.9],[-3.5,.0,0],bodyMat);
box('Rear Bumper','body',[.18,.72,1.9],[3.5,.0,0],bodyMat);
box('Windshield','body',[.12,.78,1.48],[-1.0,1.0,0],glassMat,[0,.0,-.35]);
box('Rear Glass','body',[.12,.72,1.48],[1.5,1.0,0],glassMat,[0,.0,.35]);
box('Dashboard','interior',[1.5,.32,1.55],[-.45,.7,0],darkMat);
box('Driver Seat','interior',[.7,.8,.62],[-.65,.0,-.48],darkMat);
box('Passenger Seat','interior',[.7,.8,.62],[-.65,.0,.48],darkMat);
box('Rear Seat','interior',[1.5,.65,.62],[1.05,.0,0],darkMat);
box('Steering Wheel','interior',[.08,.48,.48],[-1.0,.75,-.5],chrome,[0,Math.PI/2,0]);

// Engine bay
box('1.8L Hybrid Engine','engine',[1.7,.95,1.25],[-1.65,.62,0],darkMat);
box('Engine Cover','engine',[1.35,.12,.95],[-1.65,1.15,0],gold);
box('Air Intake','engine',[.8,.28,.55],[-2.35,1.0,0],darkMat);
box('Inverter','hybrid',[.85,.25,.75],[-.35,.82,.05],gold);

// Hybrid battery
box('Hybrid Battery Pack','hybrid',[1.7,.55,1.15],[1.05,-.35,0],mat(0x245f48,.42,.25));
box('Battery Safety Cover','hybrid',[1.45,.08,.95],[1.05,-.02,0],mat(0x2d8060,.35,.25));

// Wheels + brakes
const wheelXs=[-2.35,2.35], wheelZs=[-1.0,1.0];
for(const x of wheelXs)for(const z of wheelZs){
 const side=z<0?'L':'R', pos=[x,-.15,z];
 torus('Tire '+(x<0?'Front':'Rear')+' '+side,'wheels',.55,.18,pos,tireMat);
 cyl('Rim '+(x<0?'Front':'Rear')+' '+side,'wheels',.37,.13,pos,chrome,[Math.PI/2,0,0]);
 cyl('Brake Disc '+(x<0?'Front':'Rear')+' '+side,'brakes',.27,.07,[x,-.15,z+(z>0?-.02:.02)],chrome,[Math.PI/2,0,0]);
 cyl('Brake Caliper '+side,'brakes',.09,.12,[x-.2,-.15,z],red,[Math.PI/2,0,0]);
 for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5;
  const bz=z+(z>0?-.01:.01);
  cyl('Wheel Bolt '+side+' '+(i+1),'wheels',.035,.08,[x+.17*Math.cos(a),-.15+.17*Math.sin(a),bz],gold,[Math.PI/2,0,0],16);
 }
}

// suspension / underbody
box('Front Subframe','body',[1.6,.18,1.25],[-2.1,-.55,0],darkMat);
box('Rear Subframe','body',[1.6,.18,1.25],[2.1,-.55,0],darkMat);
box('Fuel Tank','body',[1.6,.25,1.1],[.1,-.58,0],darkMat);

// Head/tail lamps
box('Left Headlamp','body',[.16,.38,.55],[-3.58,.38,-.63],mat(0xdde9ff,.15,.45));
box('Right Headlamp','body',[.16,.38,.55],[-3.58,.38,.63],mat(0xdde9ff,.15,.45));
box('Left Tail Lamp','body',[.16,.42,.55],[3.58,.38,-.63],red);
box('Right Tail Lamp','body',[.16,.42,.55],[3.58,.38,.63],red);

const total=parts.length;document.getElementById('count').textContent=total+' أجزاء';

let selected=null, exploded=false, xray=false, activeSys='all';
const ray=new THREE.Raycaster(), pointer=new THREE.Vector2();
function select(p){
 if(selected) selected.material.emissive && selected.material.emissive.setHex(0);
 selected=p;
 if(p && p.material.emissive){p.material.emissive.setHex(0x334455);}
 document.getElementById('name').textContent=p?p.name:'لم يتم تحديد قطعة';
 document.getElementById('meta').textContent=p?('System: '+p.userData.sys.toUpperCase()+' • Interactive component'):'اضغط على أي جزء من السيارة لمعرفة اسمه ونظامه';
}
function hit(x,y){
 const r=renderer.domElement.getBoundingClientRect();
 pointer.x=((x-r.left)/r.width)*2-1;pointer.y=-((y-r.top)/r.height)*2+1;
 ray.setFromCamera(pointer,camera);
 const hits=ray.intersectObjects(parts,false);
 if(hits.length)select(hits[0].object);
}
renderer.domElement.addEventListener('pointerdown',e=>{hit(e.clientX,e.clientY);drag=true;lx=e.clientX;ly=e.clientY;});
let drag=false,lx=0,ly=0,rx=0,ry=0,dist=11;
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;rx+=dx*.008;ry=Math.max(-.7,Math.min(.9,ry+dy*.006));});
addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(6,Math.min(17,dist+e.deltaY*.008));},{passive:true});
let pinch=0;
renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const a=e.touches[0],b=e.touches[1];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch){dist=Math.max(6,Math.min(17,dist-(d-pinch)*.015));}pinch=d;}},{passive:false});
renderer.domElement.addEventListener('touchend',()=>pinch=0);

function setExplode(v){
 exploded=v;parts.forEach(p=>{const b=p.userData.base;
  let off=new THREE.Vector3();
  if(v){
   if(p.userData.sys==='body')off.set(0,1.5,0);
   if(p.userData.sys==='engine')off.set(-2,-1,0);
   if(p.userData.sys==='hybrid')off.set(1.8,-1.3,0);
   if(p.userData.sys==='wheels')off.set((b.x<0?-1:1)*1.4,0,(b.z<0?-1:1)*.8);
   if(p.userData.sys==='brakes')off.set((b.x<0?-1:1)*1.1,-.2,(b.z<0?-1:1)*.5);
   if(p.userData.sys==='interior')off.set(0,-1.5,0);
  }
  p.userData.offset.copy(off);
 });}
function applyXray(){
 parts.forEach(p=>{const s=p.userData.sys==='body'?.28:1;p.material.transparent=xray||s<1;p.material.opacity=xray?(.18+(p.userData.sys==='body'?.12:0)):1;});
}
function reset(){setExplode(false);parts.forEach(p=>p.userData.offset.set(0,0,0));rx=0;ry=0;dist=11;select(null);activeSys='all';document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===0));}
document.getElementById('explode').onclick=()=>setExplode(!exploded);
document.getElementById('xray').onclick=()=>{xray=!xray;applyXray();};
document.getElementById('reset').onclick=reset;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 activeSys=b.dataset.sys;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 parts.forEach(p=>{p.visible=activeSys==='all'||p.userData.sys===activeSys;});
});
parts.forEach(p=>p.userData.offset.set(0,0,0));

function animate(){
 requestAnimationFrame(animate);
 const target=new THREE.Vector3(0,.1,0);
 const cx=Math.sin(rx)*dist,cz=Math.cos(rx)*dist,cy=dist*.43+ry*5;
 camera.position.lerp(new THREE.Vector3(cx,cy,cz),.08);camera.lookAt(target);
 parts.forEach(p=>p.position.lerp(p.userData.base.clone().add(p.userData.offset),.1));
 renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
loading.style.display='none'; animate();
})();
</script>
</body>
</html>
